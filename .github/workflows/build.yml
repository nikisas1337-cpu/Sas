name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HelloWorld.apk
          cp boost/build/outputs/apk/debug/boost-debug.apk LteBoost.apk

      - name: Send changed APKs to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Секрети TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID не задані, пропускаю"
            exit 0
          fi
          # Надсилаємо лише APK тих програм, код яких змінився в цьому пуші.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="ALL"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          msg=$(git log -1 --format=%s)
          send() {
            module=$1; apk=$2; title=$3
            if [ "$changed" = "ALL" ] || echo "$changed" | grep -qE "^($module/|build.gradle.kts|settings.gradle.kts|gradle/)"; then
              curl -sS --fail-with-body -o /dev/null \
                --form-string chat_id="$TG_CHAT" \
                -F document=@"$apk" \
                --form-string caption="📦 $title
          🌿 ${GITHUB_REF_NAME}
          📝 $msg" \
                "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
              echo "Надіслано $apk"
            fi
          }
          send app HelloWorld.apk "Hello World"
          send boost LteBoost.apk "LTE Boost"

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            HelloWorld.apk
            LteBoost.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Hello World APK
          body: Завантажте HelloWorld.apk нижче й відкрийте його на телефоні, щоб встановити.
          files: HelloWorld.apk
          prerelease: true
          make_latest: false

      - name: Publish LTE Boost APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lte-boost-apk
          name: LTE Boost APK
          body: Завантажте LteBoost.apk нижче й відкрийте його на телефоні, щоб встановити. Для роботи потрібен Shizuku.
          files: LteBoost.apk
          prerelease: true
          make_latest: false
