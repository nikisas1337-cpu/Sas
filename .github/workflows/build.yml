name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HelloWorld.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-apk
          path: HelloWorld.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Hello World APK
          body: Завантажте HelloWorld.apk нижче й відкрийте його на телефоні, щоб встановити.
          files: HelloWorld.apk
          prerelease: true
          make_latest: false
